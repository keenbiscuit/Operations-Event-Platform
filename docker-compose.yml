services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-platform-db
    environment:
      POSTGRES_DB: ops_platform
      POSTGRES_USER: ops_platform
      POSTGRES_PASSWORD: ops_platform_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_platform -d ops_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: