spring:
  application:
    name: ops-event-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/ops_platform
    username: ops_platform
    password: ops_platform_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate = Hibernate checks entities against the existing schema
      # and fails loudly on mismatch. It never creates/alters tables itself —
      # that's Flyway's job (see below).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080